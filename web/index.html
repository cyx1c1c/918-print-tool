<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>918实验室云打印 🖨️</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="logo">🖨️ 918实验室云打印</span>
      <span class="subtitle">多文件上传 · 按需预览 · 一键打印</span>
      <button id="logoutBtn" class="btn btn-ghost btn-sm topbar-logout">🚪 登出</button>
    </div>
    <nav class="topbar-nav">
      <a href="/" class="nav-link active">🖨️ 打印</a>
      <a href="/convert.html" class="nav-link">📄 转换 PDF</a>
      <a href="/illustrate.html" class="nav-link">📖 使用与维护</a>
    </nav>
  </header>

  <main class="container">
    <!-- 工具栏 -->
    <div class="toolbar">
      <label class="tb-printer">
        <span>打印机</span>
        <select id="printer"></select>
      </label>
      <div class="tb-actions">
        <button id="printAllBtn" class="btn btn-primary" disabled>🖨️ 全部打印</button>
        <button id="clearAllBtn" class="btn btn-ghost" disabled>🗑 清空</button>
      </div>
    </div>

    <!-- 上传区（支持多文件、混合类型） -->
    <div id="dropzone" class="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">📤</div>
        <p class="dz-title">把文件拖到这里，或<span class="dz-link">点击选择</span>（可多选）</p>
        <p class="dz-hint">支持 图片 / PDF / Word / Excel / PPT / 文本，混着传也行</p>
      </div>
      <input id="fileInput" type="file" hidden multiple
        accept="image/*,.pdf,.doc,.docx,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.txt" />
    </div>

    <!-- 已上传文件列表 -->
    <ul id="fileList" class="file-list"></ul>

    <!-- 打印任务状态 -->
    <section class="jobs">
      <h3>打印任务</h3>
      <ul id="jobList" class="job-list">
        <li class="job-empty">还没有打印任务</li>
      </ul>
    </section>
  </main>

  <!-- 更多设置 弹窗 -->
  <div id="moreModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span>更多打印设置 · <span id="moreFileName" class="mono"></span></span>
        <button class="icon-btn" data-close="moreModal">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>页码范围 <em id="morePageTotal" class="hint"></em></span>
          <input id="morePageRange" type="text" placeholder="留空=全部，如 1-5,8" />
        </label>
        <label class="field">
          <span>双面</span>
          <select id="moreDuplex">
            <option value="simplex">单面</option>
            <option value="duplexlong">双面（长边翻页）</option>
            <option value="duplexshort">双面（短边翻页）</option>
          </select>
        </label>
        <label class="field">
          <span>纸张</span>
          <select id="morePaper">
            <option value="">默认（按打印机）</option>
            <option value="A4">A4</option>
            <option value="A3">A3</option>
            <option value="Letter">Letter</option>
          </select>
        </label>
        <label class="field">
          <span>每张纸打印</span>
          <select id="morePps">
            <option value="1">1 页</option>
            <option value="2">2 页</option>
            <option value="4">4 页</option>
            <option value="6">6 页</option>
            <option value="9">9 页</option>
            <option value="16">16 页</option>
          </select>
        </label>
        <div class="field">
          <span>缩放</span>
          <div class="seg" id="moreScaling">
            <button data-val="noscale" class="seg-btn">原始大小</button>
            <button data-val="shrink" class="seg-btn active">适当缩小</button>
            <button data-val="fit" class="seg-btn">铺满页面</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="moreModal">取消</button>
        <button id="moreSaveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 预览 弹窗 -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-box modal-large">
      <div class="modal-head">
        <span id="previewName" class="mono"></span>
        <button class="icon-btn" data-close="previewModal">✕</button>
      </div>
      <div id="previewLoading" class="status-box">
        <div class="spinner"></div>
        <p>正在转换并生成预览，请稍候…</p>
      </div>
      <iframe id="previewFrame" class="preview-frame hidden" title="打印预览"></iframe>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
