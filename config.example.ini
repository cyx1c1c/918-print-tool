; ============================================================
; 办公室云打印 - 配置示例
; 复制本文件为 config.ini（去掉 .example），用记事本编辑后重启生效。
; 首次运行若没有 config.ini，程序会自动生成一份，且默认 enabled=false
; （不需要登录、开箱即用）。想启用登录就把 enabled 改成 true 并设置密码。
; ============================================================
[auth]
; 是否开启登录；默认 false（不需要登录，任何人可直接访问）。
; 改成 true 才启用用户名密码验证。
enabled = false

; 登录用户名
username = admin

; 登录密码。
;   · 直接写明文最省心，例如：password = MySecret123
;   · 想更安全可填哈希（不在文件里留明文）：
;     先运行  python -m app.auth  按提示输入密码，
;     把它打印出来的  pbkdf2_sha256$...  整行粘到下面。
password = change-me

; 登录后多少小时内免登录（重启服务后需重新登录）
session_hours = 12

; 防暴力破解：同一来源 IP 连续失败多少次后锁定
max_attempts = 5

; 锁定时长（分钟）
lockout_minutes = 10
